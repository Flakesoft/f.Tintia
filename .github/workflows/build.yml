name: Build

on:
  push:
    branches:
      - main

jobs:
  build-android:
    if: contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode Android keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > android/app/ftintra.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=ftintra.jks" >> android/key.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: f-Tintia-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Remove keystore
        if: always()
        run: |
          rm -f android/app/ftintra.jks
          rm -f android/key.properties


  build-windows:
    if: contains(github.event.head_commit.message, '[build]')
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build Windows
        run: flutter build windows --release

      - name: Prepare installer payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer/payload | Out-Null

          Copy-Item `
            -Path "build/windows/x64/runner/Release/*" `
            -Destination "installer/payload/" `
            -Recurse `
            -Force

      - name: Configure installer
        shell: pwsh
        run: |
          cmake -S installer -B installer/build

      - name: Build installer
        shell: pwsh
        run: |
          cmake --build installer/build --config Release

      - name: Copy installer payload
        shell: pwsh
        run: |
          Copy-Item `
            -Path "installer/payload" `
            -Destination "installer/build/Release/payload" `
            -Recurse `
            -Force

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: f-Tintia-installer
          path: installer/build/Release/f.Tintia Setup.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: f-Tintia-windows
          path: build/windows/x64/runner/Release/